name: hermes-australian-legal
title: Australian Deal Preparation
repo: https://github.com/drfinlaymccall/hermes-australian-legal
sha: ee832d49a47ec3a2e33bc36684d2976c9fd55eba
version: "0.1.0"
description: >-
  Prepare Australian deal questions for counsel using dated regulatory sources.
  Reads selected Commonwealth instruments from a separately cloned local Git corpus,
  retains compilation commits and caveats, refuses dates outside recorded coverage,
  checks review prerequisites, calculates explicit hypothetical earn-out scenarios,
  and checks literal quotations. Preparation for counsel, not legal or tax advice.
  Disclosure — bounded local Git subprocesses, no shell; reads committed objects
  and metadata in the operator-selected corpus. No plugin network calls, credentials,
  telemetry, automatic updates, persistent matter writes or background jobs.
  The host model can receive supplied clause text and returned source excerpts.
  Approval fields are user attestations, not authenticated counsel approval or a
  host-wide permission gate. Quote matching does not verify source authenticity
  or legal support. The inspected corpus records selected Commonwealth instruments
  only and ends on 2026-09-01; it does not establish current law, Acts, case law,
  State law, tax or transaction-specific applicability.
